# Serves the built SPA only. API, /metrics and short-code redirects are routed to the
# api service by the k8s Ingress (K8S-9) — this server does no proxying.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness probe target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets — safe to cache immutably.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback — unknown paths return index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
