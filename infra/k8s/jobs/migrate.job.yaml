# DB migration (K8S-7). Applied SEPARATELY from `apply -k` (a Job spec is immutable, so
# it can't ride in the kustomize apply). The make target deletes + re-applies it.
# Relies on the stable-named ConfigMap/Secret created by the overlay apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: linkforge
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: linkforge
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: linkforge/api:local
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: linkforge-config
            - secretRef:
                name: linkforge-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
